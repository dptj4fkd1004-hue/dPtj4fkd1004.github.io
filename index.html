<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive CSS Umbrella</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Umbrella</h1>
    <p class="instructions">우산을 클릭하면 접혔다 펴집니다!</p>

    <!-- 우산 전체 컨테이너 -->
    <div class="umbrella-container" id="umbrella">
        <!-- 우산 꼭대기 핀 -->
        <div class="umbrella-top"></div>
        
        <!-- 우산 천 -->
        <div class="umbrella-canopy">
            <div class="canopy-bottom-waves">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>
        
        <!-- 우산 대 -->
        <div class="umbrella-stick"></div>
        
        <!-- J자형 손잡이 -->
        <div class="umbrella-handle"></div>
    </div>

    <!-- JavaScript 파일 연결 (href를 src로 수정했습니다!) -->
    <script src="script.js"></script>
</body>
</html>
