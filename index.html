<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yerin Baek - Letter</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e1e1e, #3b3b3b);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .album-card {
      width: 320px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: fadeIn 1.5s ease;
      transition: transform 0.3s;
    }

    .album-card:hover {
      transform: scale(1.03);
    }

    .album-image {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .album-info {
      padding: 20px;
      text-align: center;
    }

    .album-title {
      font-size: 28px;
      font-weight: bold;
      color: #222;
      margin-bottom: 8px;
    }

    .artist-name {
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
    }

    .play-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      background: #ff6b81;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .play-btn:hover {
      background: #ff4757;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="album-card">
    <!-- 앨범 이미지 -->
    <img 
      class="album-image"
      src="https://upload.wikimedia.org/wikipedia/en/7/7d/Yerin_Baek_Letter.jpg"
      alt="Yerin Baek Letter Album"
    >

    <div class="album-info">
      <div class="album-title">Letter</div>
      <div class="artist-name">백예린 (Yerin Baek)</div>

      <button class="play-btn" onclick="playMusic()">
        ▶ 음악 재생
      </button>
    </div>
  </div>

  <script>
    function playMusic() {
      alert("🎵 Letter 앨범을 재생합니다!");
    }
  </script>

</body>
</html>
